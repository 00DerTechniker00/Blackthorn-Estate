plugins { id 'java' }
version = '1.4.0'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
// Lowest compatible 26.x API; also runs on Paper 26.3.
dependencies { compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
jar { archiveFileName = 'BlackthornLive.jar' }
